name: Deploy alert_rules schema to Supabase

# Manual trigger only. Run this from the Actions tab after adding the
# SUPABASE_ACCESS_TOKEN secret (Settings > Secrets and variables > Actions).
#
# GitHub-hosted runners have normal internet access, unlike some sandboxed
# dev environments, so this is the reliable way to actually reach the
# Supabase Management API / Postgres and deploy this for real.
on:
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_REF: ruatieohvdxjnmcfhqwh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --yes

      - name: Resolve API keys
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true")
          SERVICE_KEY=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role") | .api_key')
          ANON_KEY=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon") | .api_key')
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "Could not resolve the service_role API key from the Management API" >&2
            exit 1
          fi
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo "Could not resolve the anon API key from the Management API" >&2
            exit 1
          fi
          echo "::add-mask::$SERVICE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "service_key=$SERVICE_KEY" >> "$GITHUB_OUTPUT"
          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"

      - name: Push migrations
        run: supabase db push --yes

      - name: Verify alert_rules table is reachable with service_role
        env:
          SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_key }}
        run: |
          set -euo pipefail
          # The migration ends with NOTIFY pgrst, 'reload schema' so PostgREST
          # picks up the new table immediately instead of waiting on its own
          # periodic reload -- but that notice still takes a moment to
          # propagate, so retry a few times rather than treating a cold cache
          # as a real failure (this is what broke the first deploy attempt:
          # PGRST205 "Could not find the table ... in the schema cache").
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sS -o alert-rules-service-role.json -w '%{http_code}' \
              "https://$PROJECT_REF.supabase.co/rest/v1/alert_rules?select=id&limit=1" \
              -H "apikey: $SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SERVICE_ROLE_KEY")
            echo "Attempt $attempt: HTTP $HTTP_CODE"
            cat alert-rules-service-role.json
            if [ "$HTTP_CODE" -lt 300 ]; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "service_role could not read the alert_rules table after 5 attempts" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Verify RLS blocks the anon key (this is personal data)
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o alert-rules-anon.json -w '%{http_code}' \
            "https://$PROJECT_REF.supabase.co/rest/v1/alert_rules?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          cat alert-rules-anon.json
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 300 ]; then
            echo "anon was able to query alert_rules -- it should have no grant on this table at all" >&2
            exit 1
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: alert-rules-schema-deploy-results
          path: |
            alert-rules-service-role.json
            alert-rules-anon.json
