name: Diagnose launchpad tagging (one-off)

# Manual trigger only. Read-only investigation for the "Trending shows
# almost all tokens as Not tagged" report -- see conversation. Queries the
# tokens/launchpad breakdown and pg_cron's own run history for
# sync-launchpad directly via the Supabase Management API, since this
# sandbox's egress policy blocks *.supabase.co / api.supabase.com (see
# supabase/DEPLOY.md). Nothing here mutates data. Remove this workflow once
# the investigation concludes (matches the precedent in git history for
# price_change_24h_reliable).
on:
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_REF: ruatieohvdxjnmcfhqwh

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query tokens.launchpad breakdown
        run: |
          set -euo pipefail
          SQL="select
              count(*) as total_tokens,
              count(*) filter (where launchpad is not null) as tagged,
              count(*) filter (where launchpad = 'pons') as pons,
              count(*) filter (where launchpad = 'virtuals') as virtuals,
              count(*) filter (where launchpad is null) as not_tagged,
              count(*) filter (where launchpad is null and launchpad_checked_at is null) as never_checked,
              count(*) filter (where launchpad is null and launchpad_checked_at is not null) as checked_no_match,
              max(launchpad_checked_at) as most_recent_check,
              min(launchpad_checked_at) as oldest_check
            from public.tokens;"
          PAYLOAD=$(jq -n --arg q "$SQL" '{query: $q}')
          curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq .

      - name: Query cron.job for sync-launchpad
        run: |
          set -euo pipefail
          SQL="select jobid, jobname, schedule, active, nodename, nodeport from cron.job where jobname = 'sync-launchpad-every-5-min';"
          PAYLOAD=$(jq -n --arg q "$SQL" '{query: $q}')
          curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq .

      - name: Query recent sync-launchpad cron run history
        run: |
          set -euo pipefail
          SQL="select d.runid, d.status, d.return_message, d.start_time, d.end_time
            from cron.job_run_details d
            join cron.job j on j.jobid = d.jobid
            where j.jobname = 'sync-launchpad-every-5-min'
            order by d.start_time desc
            limit 30;"
          PAYLOAD=$(jq -n --arg q "$SQL" '{query: $q}')
          curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq .

      - name: Check vault secret presence (no value revealed)
        run: |
          set -euo pipefail
          SQL="select name, created_at, updated_at from vault.secrets where name = 'sync_launchpad_service_role_key';"
          PAYLOAD=$(jq -n --arg q "$SQL" '{query: $q}')
          curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq .
